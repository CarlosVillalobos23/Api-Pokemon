<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ejercicio B - PokéAPI</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light p-4">

  <div class="container">
    <h2 class="mb-4 text-center">Buscador PokéAPI</h2>

    <div class="row g-3 mb-4">
      <div class="col-md-5">
        <div class="input-group">
          <input type="text" id="searchInput" class="form-control" placeholder="Nombre o ID del Pokémon..." />
          <button class="btn btn-primary" id="btnSearch">Buscar</button>
        </div>
      </div>
      <div class="col-md-4">
        <button class="btn btn-warning w-100" id="btnRandom">Búsqueda Aleatoria (1-150)</button>
      </div>
    </div>

    <div id="cardContainer" class="row justify-content-center mb-5"></div>

    <h4 class="mb-3">Mi Equipo (Máximo 6)</h4>
    <div class="table-responsive">
      <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Sprite</th>
            <th>Nombre</th>
            <th>Tipos</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="teamTableBody">

        </tbody>
      </table>
    </div>
  </div>


  <div class="modal fade" id="detailsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Detalles del Pokémon</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="modalBody">
  
        </div>
      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script src="index.js"></script>
</body>
</html>
